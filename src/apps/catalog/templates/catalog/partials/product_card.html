<div class="product-card bg-zinc-900 rounded-xl p-4 border border-zinc-800 hover:border-amber-500/50 transition-colors group flex flex-col h-full shadow-lg" data-category="capinhas">
    <div class="relative aspect-[4/5] bg-zinc-950 rounded-lg overflow-hidden mb-4">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="Capinha Couro" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition-all duration-500">
        {% endif %}
    </div>
    <div class="flex flex-col flex-grow">
        <span class="text-[10px] text-amber-500 uppercase font-bold tracking-wider mb-1">{{ product.category.name|default:"Sem categoria" }}</span>
        <h3 class="text-sm font-medium text-zinc-200 mb-2 line-clamp-2">{{ product.description }}</h3>
        <div class="mt-auto pt-4 border-t border-zinc-800/80">
            <div class="flex items-end justify-between" id="{{ product.id }}">
                {% csrf_token %}
                {% if product.type == "chip" %}
                    <div class="flex gap-4 w-full">
                        <a href="https://wa.me/5577981401970?text=Ol%C3%A1!%20Gostaria%20de%20saber%20mais%20sobre%20o%20chip%20%7B{{ product.description }}%7D" class="flex gap-2 h-10 w-full rounded-lg bg-zinc-800 border border-3 border-green-700 flex items-center justify-center text-green-400 hover:text-amber-500 hover:border-amber-500/50 transition-all" target="_blank" title="Saiba mais sobre o chip">
                            <i class="fab fa-whatsapp"></i> <span>Saiba mais</span>
                        </a>
                    </div>
                {% else %}
                    <div>
                        <p class="text-lg font-bold text-white">R$ {{ product.sale_price|floatformat:2|default:"0,00" }}</p>
                    </div>
                    <button class="add-to-cart h-8 w-8 flex items-center justify-center bg-zinc-800 border border-zinc-700 hover:bg-amber-500 hover:text-zinc-950 hover:border-amber-500 text-zinc-300 rounded-lg transition-all active:scale-95" title="Adicionar" value="increase">
                        <i class="fas fa-plus text-sm"></i>
                    </button>
                {% endif %}
            </div>
        </div>
    </div>
</div>
