<form action="{% url "catalog:catalog_list" %}" method="GET">
    <input type="hidden" name="category_id" value="{{ category.id }}">
    <button type="submit" class="filter-btn bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-amber-500/50 hover:text-amber-500 px-6 py-2.5 rounded-lg text-sm font-medium whitespace-nowrap transition-colors" data-filter="audio">
        {{ category.name }} 
    </button>
</form>
