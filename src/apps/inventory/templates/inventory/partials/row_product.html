<tr class="hover:bg-zinc-800/50 transition-colors">
    <td class="p-4">
        <div class="flex items-center gap-3">
            {% if product.type == 'acessory' %}
                <div
                    class="w-10 h-10 rounded bg-zinc-950 border border-zinc-800 flex items-center justify-center text-amber-500">
                    <i class="fas fa-cogs"></i>
                </div>
            {% else %}
                <div
                    class="w-10 h-10 rounded bg-zinc-950 border border-zinc-800 flex items-center justify-center text-amber-500">
                    <i class="fas fa-sim-card"></i>
                </div>
            {% endif %}
            <div class="font-medium text-white">{{ product.description }}</div>
        </div>
    </td>
    <td class="p-4 text-sm text-white">{{ product.get_type_display }}</td>
    <td class="p-4 text-sm text-white">{{ product.category }}</td>
    <td class="p-4 text-center font-medium text-white">{{ product.stock_quantity }}</td>
    <td class="p-4 text-center font-medium text-white">{{ product.average_cost }}</td>
    <td class="p-4 text-center font-medium text-white">{{ product.sale_price }}</td>
    <td class="p-4 text-center">
        <button onclick="openProductModal(this)" data-description="{{ product.description|default:'Sem descrição' }}"
            data-barcode="{{ product.barcode|default:'Sem código' }}"
            data-type="{% if product.type == 'acessory' %}Acessório{% else %}Chip{% endif %}"
            data-category="{{ product.category.name|default:'-' }}" data-stock="{{ product.stock_quantity }}"
            data-cost="{{ product.average_cost|default:'0.00' }}" data-price="{{ product.sale_price|default:'0.00' }}"
            data-image="{% if product.image %}{{ product.image.url }}{% else %}no-image{% endif %}"
            class="p-2 text-zinc-400 hover:text-amber-500 hover:bg-amber-500/10 rounded-lg transition-all"
            title="Ver Detalhes">
            <i class="fas fa-eye text-lg"></i>
        </button>
        <a href="{% url 'inventory:update_product' product.id %}" class="p-2 text-zinc-400 hover:text-amber-500 hover:bg-amber-500/10 rounded-lg transition-all" title="Editar Produto">
            <i class="fas fa-edit text-lg"></i>
        </a>
        <form action="{% url 'inventory:delete_product' product.id %}" method="POST" class="inline-block" 
          onsubmit="return confirm('ATENÇÃO: Tem certeza que deseja excluir o produto {{ product.description }}? Essa ação não pode ser desfeita.');">
            {% csrf_token %}
            <button type="submit" class="p-2 text-zinc-400 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-all" title="Excluir">
                <i class="fas fa-trash text-lg"></i>
            </button>
        </form>
        {% if product.type == "chip" %}
            <button onclick="openDispatchModal(this)" 
                data-id="{{ product.id }}" 
                data-name="{{ product.description }}"
                data-stock="{{ product.stock_quantity }}"
                class="p-2 text-zinc-400 hover:text-blue-500 hover:bg-blue-500/10 rounded-lg transition-all"
                title="Distribuir para Promotor">
                <i class="fas fa-truck text-lg"></i>
            </button>
        {% endif %}

    </td>
</tr>
