<!-- Modal para Criar Categoria -->
<div id="category-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto" aria-labelledby="modal-category-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity cursor-pointer" onclick="closeCategoryModal()"></div>

    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <div class="relative bg-zinc-900 rounded-xl text-left overflow-hidden shadow-2xl transform transition-all duration-200 scale-95 opacity-0 sm:my-8 sm:max-w-md w-full border border-zinc-800 ring-1 ring-amber-500/20">
            
            <div class="px-6 py-5 border-b border-zinc-800 flex justify-between items-center bg-black/30">
                <h3 class="text-xl font-bold text-white" id="modal-category-title">Nova Categoria</h3>
                <button type="button" onclick="closeCategoryModal()" class="text-zinc-500 hover:text-red-500 transition-colors">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form id="form-new-category">
                {% csrf_token %}
                <div class="px-6 py-6 space-y-4">
                    <div>
                        <label for="new_category_name" class="block text-sm font-medium mb-1 text-gray-200">Nome da Categoria *</label>
                        <input type="text" name="name" id="new_category_name" required class="w-full bg-black/50 border border-zinc-800 text-zinc-100 rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 transition-all placeholder-zinc-600" placeholder="Ex: Capinhas, Películas...">
                    </div>
                </div>

                <div class="bg-black/50 px-6 py-4 flex justify-end gap-3 border-t border-zinc-800">
                    <button type="button" onclick="closeCategoryModal()" class="text-zinc-400 hover:text-white font-medium px-4 py-2 transition-colors">
                        Cancelar
                    </button>
                    <!-- O type="submit" permite salvar apertando "Enter" no teclado! -->
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-5 py-2.5 rounded-lg transition-colors shadow-lg shadow-amber-500/20 flex items-center gap-2">
                        <i class="fas fa-save"></i> Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
