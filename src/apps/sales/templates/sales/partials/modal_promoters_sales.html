<!-- Modal de Detalhes da Venda -->
<div id="sale-details-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <!-- Fundo escuro transparente -->
    <div class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity cursor-pointer" onclick="closeSaleDetailsModal()"></div>

    <!-- Container do Modal -->
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <!-- Anel (ring) alterado para emerald -->
        <div class="relative bg-zinc-900 rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:max-w-xl w-full border border-zinc-800 ring-1 ring-emerald-500/20">
            
            <!-- Cabeçalho do Modal -->
            <div class="px-6 py-5 border-b border-zinc-800 flex justify-between items-center bg-black/30">
                <h3 class="text-xl font-bold text-white">Detalhes da Venda</h3>
                <button onclick="closeSaleDetailsModal()" class="text-zinc-500 hover:text-red-500 transition-colors focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Corpo do Modal -->
            <div class="px-6 py-6">
                <div class="flex flex-col sm:flex-row gap-6">
                    
                    <!-- Ícone Decorativo (Substituindo a imagem do produto) -->
                    <div class="shrink-0 mx-auto sm:mx-0">
                        <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-xl bg-zinc-950 flex flex-col items-center justify-center border-2 border-zinc-800 shadow-md text-emerald-500/80">
                            <i class="fas fa-receipt text-4xl mb-2"></i>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Comprovante</span>
                        </div>
                    </div>

                    <!-- Informações da Venda -->
                    <div class="flex-1 space-y-4">
                        
                        <!-- ICCID e Data -->
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-1">
                                <span class="block text-zinc-500 text-xs font-bold uppercase tracking-wider mb-1">ICCID do Chip</span>
                                <p class="text-zinc-200 bg-zinc-950 px-3 py-1.5 rounded-md border border-zinc-800 font-mono text-sm" id="modal-sale-iccid"></p>
                            </div>
                            <div class="text-right">
                                <span class="block text-zinc-500 text-xs font-bold uppercase tracking-wider mb-1">Data da Venda</span>
                                <p class="text-zinc-300 text-sm" id="modal-sale-date"></p>
                            </div>
                        </div>
                        
                        <!-- Produto e Promotor -->
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <span class="block text-zinc-500 text-xs font-bold uppercase tracking-wider mb-1">Produto</span>
                                <p class="text-zinc-300 text-sm" id="modal-sale-product"></p>
                            </div>
                            <div>
                                <span class="block text-zinc-500 text-xs font-bold uppercase tracking-wider mb-1">Promotor</span>
                                <p class="text-zinc-300 text-sm" id="modal-sale-promoter"></p>
                            </div>
                        </div>

                        <!-- Dados do Cliente -->
                        <div id="client-data-section" class="bg-black/30 p-3 rounded-lg border border-zinc-800/50">
                            <span class="block text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-2 border-b border-zinc-800/50 pb-1">Dados do Cliente</span>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <span class="block text-zinc-600 text-[10px] uppercase">Nome</span>
                                    <p class="text-zinc-300 text-sm truncate" id="modal-sale-customer-name"></p>
                                </div>
                                <div>
                                    <span class="block text-zinc-600 text-[10px] uppercase">CPF</span>
                                    <p class="text-zinc-300 text-sm font-mono" id="modal-sale-customer-cpf"></p>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Mensagem alternativa caso não haja cadastro -->
                        <div id="no-client-data-msg" class="bg-black/20 p-3 rounded-lg border border-zinc-800/30 text-center hidden">
                            <span class="text-zinc-600 text-xs italic">Venda simples. Não houve cadastro de cliente.</span>
                        </div>

                        <!-- Valores Financeiros -->
                        <div class="grid grid-cols-3 gap-3 pt-3 border-t border-zinc-800/50">
                            <div>
                                <span class="block text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1">Valor Chip</span>
                                <p class="text-zinc-400 font-medium" id="modal-sale-price"></p>
                            </div>
                            <div>
                                <span class="block text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1">Taxa Serviço <span id="modal-sale-service-badge" class="ml-1 text-[8px] px-1 bg-zinc-800 rounded"></span></span>
                                <p class="text-zinc-400 font-medium" id="modal-sale-fee"></p>
                            </div>
                            <div>
                                <span class="block text-emerald-500/70 text-[10px] font-bold uppercase tracking-wider mb-1">Total Pago</span>
                                <p class="text-emerald-500 font-bold text-lg" id="modal-sale-total"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rodapé do Modal -->
            <div class="bg-black/50 px-6 py-4 flex justify-end gap-3 border-t border-zinc-800">
                <button onclick="closeSaleDetailsModal()" class="bg-zinc-800 hover:bg-zinc-700 text-white font-medium px-5 py-2.5 rounded-lg transition-colors border border-zinc-700 flex items-center gap-2">
                    Fechar
                </button>
            </div>
        </div>
    </div>
</div>
