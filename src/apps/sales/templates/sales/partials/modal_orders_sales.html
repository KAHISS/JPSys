<div id="order-details-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity cursor-pointer" onclick="closeOrderModal()"></div>

    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <div class="relative bg-zinc-900 rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:max-w-xl w-full border border-zinc-800 ring-1 ring-blue-500/20">
            
            <div class="px-6 py-5 border-b border-zinc-800 flex justify-between items-center bg-black/30">
                <h3 class="text-xl font-bold text-white">Detalhes do Pedido</h3>
                <button onclick="closeOrderModal()" class="text-zinc-500 hover:text-red-500 transition-colors focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <div class="px-6 py-6">
                <div class="flex flex-col sm:flex-row gap-6">
                    
                    <div class="shrink-0 mx-auto sm:mx-0">
                        <div class="w-24 h-24 sm:w-32 sm:h-32 rounded-xl bg-zinc-950 flex flex-col items-center justify-center border-2 border-zinc-800 shadow-md text-blue-500/80">
                            <i class="fas fa-box-open text-4xl mb-2"></i>
                            <span class="text-[10px] font-bold uppercase tracking-widest text-zinc-500">Resumo</span>
                        </div>
                    </div>

                    <div class="flex-1 space-y-4">
                        
                        <div class="flex justify-between items-start gap-4">
                            <div class="flex-1">
                                <span class="block text-zinc-500 text-xs font-bold uppercase tracking-wider mb-1">Nº do Pedido</span>
                                <p class="text-zinc-200 bg-zinc-950 px-3 py-1.5 rounded-md border border-zinc-800 font-mono text-sm inline-block">
                                    #<span id="modal-order-id"></span>
                                </p>
                            </div>
                            <div class="text-right">
                                <span class="block text-zinc-500 text-xs font-bold uppercase tracking-wider mb-1">Data de Criação</span>
                                <p class="text-zinc-300 text-sm font-mono" id="modal-order-date"></p>
                            </div>
                        </div>
                        
                        <div>
                            <span class="block text-zinc-500 text-xs font-bold uppercase tracking-wider mb-1">Cliente / Solicitante</span>
                            <p class="text-zinc-300 text-sm font-medium" id="modal-order-client"></p>
                        </div>

                        <div class="bg-black/30 p-3 rounded-lg border border-zinc-800/50">
                            <span class="block text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-2 border-b border-zinc-800/50 pb-1">
                                <i class="fas fa-comment-alt mr-1"></i> Observações
                            </span>
                            <p class="text-zinc-400 text-sm italic" id="modal-order-obs"></p>
                        </div>

                        <div class="grid grid-cols-3 gap-3 pt-3 border-t border-zinc-800/50">
                            <div>
                                <span class="block text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1">Status</span>
                                <p class="text-zinc-300 font-medium text-sm" id="modal-order-status"></p>
                            </div>
                            <div>
                                <span class="block text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1">Qtd. Itens</span>
                                <p class="text-zinc-300 font-medium text-sm" id="modal-order-quantity"></p>
                            </div>
                            <div>
                                <span class="block text-emerald-500/70 text-[10px] font-bold uppercase tracking-wider mb-1">Valor Total</span>
                                <p class="text-emerald-500 font-bold text-lg leading-none mt-1" id="modal-order-total"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-black/50 px-6 py-4 flex justify-end gap-3 border-t border-zinc-800">
                <button onclick="closeOrderModal()" class="bg-zinc-800 hover:bg-zinc-700 text-white font-medium px-5 py-2.5 rounded-lg transition-colors border border-zinc-700 flex items-center gap-2">
                    Fechar
                </button>
            </div>
        </div>
    </div>
</div>
