<div id="edit-item-modal" class="fixed inset-0 z-[100] hidden overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
    <div class="fixed inset-0 bg-black/80 backdrop-blur-sm transition-opacity cursor-pointer" onclick="closeEditItemModal()"></div>

    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:p-0">
        <div class="relative bg-zinc-900 rounded-xl text-left overflow-hidden shadow-2xl transform transition-all sm:my-8 sm:max-w-md w-full border border-zinc-800 ring-1 ring-amber-500/20">
            
            <div class="px-6 py-5 border-b border-zinc-800 flex justify-between items-center bg-black/30">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i class="fas fa-edit text-amber-500"></i> Editar Quantidade
                </h3>
                <button onclick="closeEditItemModal()" class="text-zinc-500 hover:text-red-500 transition-colors focus:outline-none">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <form id="edit-item-form" method="POST" action="">
                {% csrf_token %}
                <input type="hidden" name="order" value="{{ order.id }}">
                <div class="px-6 py-6 space-y-4">
                    
                    <div class="bg-black/30 p-4 rounded-lg border border-zinc-800/50">
                        <span class="block text-zinc-500 text-[10px] font-bold uppercase tracking-wider mb-1">Produto Selecionado</span>
                        <p class="text-zinc-200 text-sm font-medium" id="modal-item-product"></p>
                    </div>

                    <div>
                        <label for="modal-item-quantity" class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-2">
                            Nova Quantidade
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-box text-zinc-500"></i>
                            </div>
                            <input type="number" name="quantity" id="modal-item-quantity" min="1" step="1" required
                                class="w-full bg-black/50 border border-zinc-800 text-white rounded-lg pl-10 pr-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-transparent transition-all">
                        </div>
                        <p class="text-[10px] text-zinc-500 mt-2">
                            <i class="fas fa-info-circle mr-1"></i> O estoque será automaticamente recalculado ao salvar.
                        </p>
                    </div>
                </div>

                <div class="bg-black/50 px-6 py-4 flex justify-end gap-3 border-t border-zinc-800">
                    <button type="button" onclick="closeEditItemModal()" class="bg-transparent hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 font-medium px-5 py-2.5 rounded-lg transition-colors border border-zinc-800">
                        Cancelar
                    </button>
                    <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-black font-bold px-5 py-2.5 rounded-lg transition-all shadow-lg shadow-amber-500/20 flex items-center gap-2">
                        <i class="fas fa-check"></i> Salvar Alteração
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
