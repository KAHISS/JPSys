<tr class="hover:bg-zinc-800/50 transition-colors">
    <!-- Coluna 1: Usuário (com ícone dinâmico) -->
    <td class="p-4">
        <div class="flex items-center gap-3">
            {% if user.type == 'admin' %}
                <div class="w-10 h-10 rounded bg-zinc-950 border border-zinc-800 flex items-center justify-center text-amber-500">
                    <i class="fas fa-user-shield"></i>
                </div>
            {% elif user.type == 'promoter' %}
                <div class="w-10 h-10 rounded bg-zinc-950 border border-zinc-800 flex items-center justify-center text-amber-500">
                    <i class="fas fa-user-tie"></i>
                </div>
            {% else %}
                <div class="w-10 h-10 rounded bg-zinc-950 border border-zinc-800 flex items-center justify-center text-amber-500">
                    <i class="fas fa-user"></i>
                </div>
            {% endif %}
            <div class="font-medium text-white">{{ user.username }}</div>
        </div>
    </td>

    <!-- Coluna 2: Nome Completo -->
    <td class="p-4 text-sm text-white">
        {% if user.first_name or user.last_name %}
            {{ user.first_name }} {{ user.last_name }}
        {% else %}
            <span class="text-zinc-500">-</span>
        {% endif %}
    </td>

    <!-- Coluna 3: Tipo de Perfil -->
    <td class="p-4 text-center text-sm text-white">
        {{ user.get_type_display }}
    </td>

    <!-- Coluna 4: Telefone -->
    <td class="p-4 text-sm text-white">
        {{ user.phone|default:"-" }}
    </td>

    <!-- Coluna 5: Ações -->
    <td class="p-4 text-center flex items-center justify-center gap-2">
        <!-- Visualizar -->
        <button onclick="openUserModal(this)" 
            data-username="{{ user.username }}"
            data-fullname="{{ user.first_name }} {{ user.last_name }}"
            data-type="{{ user.get_type_display }}"
            data-phone="{{ user.phone|default:'-' }}"
            data-document="{{ user.document|default:'-' }}"
            data-address="{{ user.address|default:'-' }}"
            data-city="{{ user.city|default:'-' }}"
            class="p-2 text-zinc-400 hover:text-amber-500 hover:bg-amber-500/10 rounded-lg transition-all"
            title="Ver Detalhes">
            <i class="fas fa-eye text-lg"></i>
        </button>        
        <a href="{% url 'users:update_user' user.id %}" class="p-2 text-zinc-400 hover:text-amber-500 hover:bg-amber-500/10 rounded-lg transition-all" title="Editar Usuário">
            <i class="fas fa-edit text-lg"></i>
        </a>        
        <form action="{% url 'users:delete_user' user.id %}" method="POST" class="inline-block" 
          onsubmit="return confirm('ATENÇÃO: Tem certeza que deseja excluir o usuário {{ user.username }}? Essa ação não pode ser desfeita.');">
            {% csrf_token %}
            <input type="hidden" name="delete" value="true">
            <button type="submit" class="p-2 text-zinc-400 hover:text-red-500 hover:bg-red-500/10 rounded-lg transition-all" title="Excluir">
                <i class="fas fa-trash text-lg"></i>
            </button>
        </form>
    </td>
</tr>
