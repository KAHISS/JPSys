<!DOCTYPE html>
<html lang="pt">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock title %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'global/css/animation_and_scrollbar.css' %}">
    <script src="{% static "global/js/sidebar_control.js" %}" defer></script>
</head>
<body class="bg-zinc-950 font-sans text-zinc-100">
    <p hidden id="section">{{ section }}</p>
    <div class="flex h-screen overflow-hidden">
        
        <!-- Overlay escuro para mobile -->
        <div id="sidebar-overlay" class="fixed inset-0 bg-black bg-opacity-70 z-40 hidden md:hidden transition-opacity" onclick="toggleSidebar()"></div>

        <!-- Sidebar -->
        <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-black text-zinc-300 transform -translate-x-full transition-transform duration-300 md:relative md:translate-x-0 flex flex-col shadow-2xl md:shadow-none border-r border-zinc-800">
            
            <!-- Logo & Mobile Close -->
            <div class="flex items-center justify-between p-6 border-b border-zinc-800">
                <div class="text-2xl font-serif font-bold tracking-wider">
                    <i class="fas fa-crown text-amber-500 mr-2"></i>
                    <span class="text-amber-500">JP</span><span class="text-white text-lg ml-1">Acessórios</span>
                </div>
                <button class="md:hidden text-zinc-500 hover:text-amber-500" onclick="toggleSidebar()">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Navegação -->
            <nav class="flex-grow p-4 space-y-2 overflow-y-auto">
                <a href="{% url "users:users_list" %}" class="nav-btn w-full flex items-center space-x-3 p-3 rounded-lg {{ user_active }} font-semibold transition-colors duration-200 stock">
                    <i class="fas fa-user w-5 text-center"></i>
                    <span>Vendas</span>
                </a>
                <a href="{% url "inventory:inventory_list" %}" class="nav-btn w-full flex items-center space-x-3 p-3 rounded-lg {{ inventory_active }} font-semibold transition-colors duration-200  stock">
                    <i class="fas fa-box w-5 text-center"></i>
                    <span>Estoque</span>
                </a>
                <a href="{% url "inventory:promoter_inventory_list" %}" class="nav-btn w-full flex items-center space-x-3 p-3 rounded-lg {{ promoter_inventory_active }} font-semibold transition-colors duration-200 stock">
                    <i class="fas fa-truck w-5 text-center"></i>
                    <span>Distribuições</span>
                </a>
            </nav>

            <!-- Rodapé Sidebar -->
            <div class="p-4 border-t border-zinc-800">
                <button class="w-full flex items-center space-x-3 p-3 rounded-lg text-red-400 hover:bg-red-500/10 hover:text-red-400 transition-colors duration-200 font-medium">
                    <i class="fas fa-sign-out-alt w-5 text-center"></i>
                    <span>Sair do Sistema</span>
                </button>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <div class="flex-1 flex flex-col h-screen overflow-hidden">
            
            <!-- Cabeçalho -->
            <header class="bg-zinc-900/80 backdrop-blur-md shadow-sm h-16 flex items-center justify-between px-4 sm:px-6 lg:px-8 z-10 border-b border-zinc-800">
                <div class="flex items-center">
                    <!-- Menu Hambúrguer (Mobile) -->
                    <button class="md:hidden text-amber-500 hover:text-amber-400 focus:outline-none mr-4" onclick="toggleSidebar()">
                        <i class="fas fa-bars text-2xl"></i>
                    </button>
                    <a href="{{ back_url }}" id="page-title" class="text-xl text-white hidden sm:block">{{ path }}</a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button class="text-zinc-400 hover:text-amber-500 relative transition-colors">
                        <i class="fas fa-bell text-xl"></i>
                        <span class="absolute top-0 right-0 -mt-1 -mr-1 flex h-3 w-3">
                            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-amber-400 opacity-75"></span>
                            <span class="relative inline-flex rounded-full h-3 w-3 bg-amber-500"></span>
                        </span>
                    </button>
                    <div class="h-8 w-px bg-zinc-700"></div>
                    <div class="flex items-center gap-3 cursor-pointer group">
                        <div class="hidden md:block text-right">
                            <p class="text-sm font-medium text-white transition-colors">{{ user.username }}</p>
                        </div>
                        <img src="https://ui-avatars.com/api/?name={{ user.username }}&background=f59e0b&color=000" class="w-10 h-10 rounded-full border-2 border-amber-500 shadow-sm shadow-amber-500/30" alt="Avatar do Utilizador">
                    </div>
                </div>
            </header>

            <!-- Área de Visualização (Scrollável) -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-zinc-950 p-4 sm:p-6 lg:p-8">
                {% include 'global/partials/messages.html' %}
                {% block content %}
                {% endblock content %}
            </main>
        </div>
    </div>
</body>
</html>
