{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP Acessórios | Recuperar Senha</title>
    <link rel="icon" type="image/x-icon" href="{% static 'global/img/favicon.ico' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-amber-500 selection:text-zinc-950">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl overflow-hidden relative">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="px-8 pt-8 pb-6 border-b border-zinc-800 bg-black/20">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="h-11 w-11 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-500">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-white">Recuperar Senha</h2>
                            <p class="text-sm text-zinc-400">Informe seu e-mail para receber o link de redefinição.</p>
                        </div>
                    </div>
                </div>

                <div class="px-8 py-8">
                    <form method="post" class="space-y-5">
                        {% csrf_token %}

                        <div>
                            <label for="{{ form.email.id_for_label }}" class="block text-sm font-medium text-zinc-300 mb-2">E-mail</label>
                            <div class="relative [&>input]:w-full [&>input]:bg-zinc-950 [&>input]:border [&>input]:border-zinc-800 [&>input]:rounded-xl [&>input]:px-4 [&>input]:py-3 [&>input]:pl-11 [&>input]:text-zinc-100 [&>input]:placeholder-zinc-500 [&>input:focus]:outline-none [&>input:focus]:border-amber-500 [&>input:focus]:ring-1 [&>input:focus]:ring-amber-500">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-zinc-500 pointer-events-none">
                                    <i class="fas fa-envelope text-sm"></i>
                                </span>
                                {{ form.email }}
                            </div>
                            {% if form.email.errors %}
                                <p class="mt-2 text-sm text-red-400">{{ form.email.errors.0 }}</p>
                            {% endif %}
                        </div>

                        <button type="submit" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
                            <i class="fas fa-paper-plane"></i>
                            Enviar e-mail
                        </button>
                    </form>
                </div>
            </div>

            <p class="text-center text-xs text-zinc-500 mt-4">
                © JP Acessórios
            </p>
        </div>
    </main>
</body>
</html>
