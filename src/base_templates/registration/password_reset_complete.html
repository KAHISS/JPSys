{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JP Acessórios | Senha Alterada</title>
    <link rel="icon" type="image/x-icon" href="{% static 'global/img/favicon.ico' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased selection:bg-amber-500 selection:text-zinc-950">
    <main class="min-h-screen flex items-center justify-center px-4 py-12">
        {% include "global/partials/messages.html" %}
        <div class="w-full max-w-md">
            <div class="bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl overflow-hidden relative">
                <div class="absolute -top-10 -right-10 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <div class="px-8 pt-8 pb-6 border-b border-zinc-800 bg-black/20">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="h-11 w-11 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400">
                            <i class="fas fa-circle-check"></i>
                        </div>
                        <div>
                            <h2 class="text-2xl font-bold text-white">Senha alterada</h2>
                            <p class="text-sm text-zinc-400">Sua senha foi redefinida com sucesso.</p>
                        </div>
                    </div>
                </div>

                <div class="px-8 py-8 space-y-5">
                    <div class="rounded-xl border border-emerald-500/20 bg-emerald-500/10 p-4 text-emerald-300">
                        <div class="flex items-center gap-2 font-semibold mb-2">
                            <i class="fas fa-shield-halved"></i>
                            Redefinição concluída
                        </div>
                        <p class="text-sm leading-relaxed">
                            Sua senha foi alterada com sucesso. Agora você já pode acessar sua conta com a nova senha.
                        </p>
                    </div>

                    <a href="{% url 'users:login' %}" class="w-full bg-amber-500 hover:bg-amber-400 text-black font-bold py-3 px-4 rounded-xl transition-all shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2">
                        <i class="fas fa-right-to-bracket"></i>
                        Ir para o login
                    </a>
                </div>
            </div>

            <p class="text-center text-xs text-zinc-500 mt-4">
                © JP Acessórios
            </p>
        </div>
    </main>
</body>
</html>
